<style>
:root {
  --ink:   #18223A;
  --base:  #F6F5F1;
  --surf:  #FFFFFF;
  --bdr:   #E5E1D8;
  --muted: #7A8090;
  --amber: #D07F3E;
  --sh:    #3A76A8; --sh-d: #EDF4FA;
  --ck:    #9B3D5E; --ck-d: #F9EEF2;
  --hcm:   #2B7A52; --hcm-d:#E8F5EE;
  --hn:    #8B4A1E; --hn-d: #F5EBE0;
  --nav-h: 64px;
  --hdr-h: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--base);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;
  min-height:100dvh;
}
/* Responsive center container */
#app-wrap{
  max-width:500px;margin:0 auto;
  min-height:100dvh;position:relative;
  background:var(--base);
}
/* ── Header ─────────────────────────── */
#hdr{
  position:sticky;top:0;z-index:100;
  background:var(--ink);color:#F6F5F1;
  height:var(--hdr-h);
  display:flex;align-items:center;padding:0 1.2rem;gap:0.5rem;
}
#hdr-title{
  font-family:'Fraunces',Georgia,serif;font-size:1rem;font-weight:600;flex:1;
}
#hdr-meta{font-size:0.7rem;color:rgba(246,245,241,0.55);text-align:right}
/* ── Tabs ───────────────────────────── */
.tab{display:none;padding:0.85rem;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 0.85rem)}
.tab.on{display:block}
/* ── Bottom nav ─────────────────────── */
#nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:500px;
  background:var(--surf);border-top:1px solid var(--bdr);
  display:flex;padding-bottom:var(--safe-b);z-index:100;
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:0.2rem;
  padding:0.55rem 0;background:none;border:none;cursor:pointer;
  color:var(--muted);font-family:'Inter',sans-serif;
  font-size:0.62rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
  transition:color .15s;
}
.nb.on{color:var(--ink)}
.nb svg{width:21px;height:21px}
/* ── Cards ──────────────────────────── */
.card{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:12px;overflow:hidden;margin-bottom:0.65rem;
}
/* ── Day detail (Heute) ─────────────── */
.today-band{height:5px}
.today-meta{
  padding:0.65rem 0.85rem 0;
  display:flex;align-items:center;gap:0.45rem;
}
.city-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cpill{
  font-size:0.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.12rem .45rem;border-radius:99px;
}
.today-h{
  font-family:'Fraunces',Georgia,serif;font-size:1.15rem;font-weight:600;
  padding:.2rem .85rem .55rem;line-height:1.2;
}
.today-date{
  padding:0 .85rem .5rem;font-size:.72rem;color:var(--muted);
}
/* ── Check items ────────────────────── */
.ci{
  display:flex;align-items:center;gap:0.55rem;
  padding:.5rem .85rem;
  border-top:1px solid var(--bdr);
  cursor:pointer;user-select:none;
  transition:background .1s;
}
.ci:hover{background:var(--base)}
.ci.done{opacity:.45}
.ci:first-child{border-top:none}
.cbox{
  width:19px;height:19px;border-radius:5px;
  border:2px solid var(--bdr);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;background:var(--surf);
}
.ci.done .cbox{background:var(--cc,#3A76A8);border-color:var(--cc,#3A76A8)}
.ct{font-size:.7rem;color:var(--muted);min-width:3rem;flex-shrink:0;font-variant-numeric:tabular-nums}
.cl{flex:1;font-size:.86rem;font-weight:500}
.ci.done .cl{text-decoration:line-through}
/* ── Progress ───────────────────────── */
.prog{
  display:flex;align-items:center;gap:.65rem;
  padding:.45rem .85rem .65rem;
}
.ptrack{flex:1;height:3px;background:var(--bdr);border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .3s}
.plabel{font-size:.7rem;color:var(--muted);white-space:nowrap}
/* ── Countdown ──────────────────────── */
.cdown{text-align:center;padding:2.5rem 1rem}
.cdown-n{
  font-family:'Fraunces',serif;font-size:5rem;font-weight:700;line-height:1;
}
.cdown-u{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem}
.cdown-d{font-size:.95rem;font-weight:600;margin-top:.85rem}
/* ── Tage ───────────────────────────── */
.city-sep{
  display:flex;align-items:center;gap:.5rem;
  margin:1rem 0 .35rem;
}
.city-sep:first-child{margin-top:0}
.city-sep-name{font-family:'Fraunces',serif;font-size:.9rem;font-weight:700}
.city-sep-sub{font-size:.7rem;color:var(--muted);margin-left:auto}
.dlc{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:9px;display:flex;margin-bottom:.4rem;
  overflow:hidden;cursor:pointer;transition:box-shadow .15s;
}
.dlc:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dlstripe{width:4px;flex-shrink:0}
.dlcont{flex:1;padding:.55rem .7rem}
.dlhdr{display:flex;align-items:center;gap:.4rem;margin-bottom:.15rem}
.dlnum{
  font-family:'Fraunces',serif;font-size:.82rem;font-weight:700;
  min-width:1.8rem;
}
.dltitle{font-weight:600;font-size:.85rem;flex:1}
.dldate{font-size:.68rem;color:var(--muted);margin-bottom:.25rem}
.dlitems{font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;gap:.12rem}
.dlrow{display:flex;gap:.35rem}
.dlrow .t{min-width:2.8rem;flex-shrink:0}
.pill-sm{
  font-size:.58rem;font-weight:700;padding:.08rem .35rem;
  border-radius:99px;flex-shrink:0;
}
/* ── Info ───────────────────────────── */
.slabel{
  font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:.9rem 0 .4rem;
}
.slabel:first-child{margin-top:0}
.hcard{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:10px;margin-bottom:.45rem;overflow:hidden;
}
.htop{display:flex;gap:.65rem;padding:.7rem;align-items:flex-start}
.hico{
  width:34px;height:34px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.hname{font-weight:700;font-size:.88rem}
.hloc{font-size:.72rem;color:var(--muted)}
.hdates{display:flex;border-top:1px solid var(--bdr)}
.hdc{flex:1;padding:.45rem .7rem;border-right:1px solid var(--bdr)}
.hdc:last-child{border-right:none}
.hdl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hdv{font-weight:600;font-size:.82rem}
.hwarn{
  background:#FFF5E8;border-top:1px solid #FFD5A0;
  padding:.35rem .7rem;font-size:.72rem;color:#A0500A;font-weight:600;
}
.fitem{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:10px;padding:.65rem .75rem;
  margin-bottom:.4rem;display:flex;gap:.65rem;align-items:center;
}
.frt{flex:1}
.fft{font-weight:600;font-size:.83rem}
.fsub{font-size:.7rem;color:var(--muted)}
.ftime{font-size:.76rem;font-weight:600;color:var(--muted);white-space:nowrap}
/* ── Tomorrow ───────────────────────── */
.tmw{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:10px;padding:.65rem .85rem;margin-bottom:.65rem;
}
.tmw-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.25rem}
.tmw-title{font-weight:600;font-size:.88rem}
.tmw-city{font-size:.72rem;color:var(--muted)}
/* ── Back button ────────────────────── */
.back-btn{
  display:flex;align-items:center;gap:.35rem;
  font-size:.75rem;font-weight:600;color:var(--muted);
  background:none;border:none;cursor:pointer;padding:.4rem 0 .6rem;
}
.back-btn svg{width:16px;height:16px}
/* ── Toast ──────────────────────────── */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + .75rem);
  left:50%;transform:translateX(-50%);
  background:var(--ink);color:#F6F5F1;
  padding:.35rem .9rem;border-radius:99px;
  font-size:.72rem;font-weight:500;
  pointer-events:none;opacity:0;transition:opacity .25s;z-index:200;white-space:nowrap;
}
#toast.on{opacity:1}
/* ── Done / Countdown cities ────────── */
.route-cities{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.rci-btn{
  display:flex;align-items:center;gap:.75rem;width:100%;
  background:var(--surf);border:1px solid var(--bdr);border-radius:12px;
  padding:.55rem .75rem;cursor:pointer;transition:background .15s,transform .1s;
  font-family:inherit;
}
.rci-btn:active{background:var(--cd,#EDF4FA);transform:scale(.98)}
.rci{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem .65rem;
  background:var(--surf);border:1px solid var(--bdr);border-radius:9px;
}
</style>

// ── Helpers ──────────────────────────────────────────────────────────
const ld = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const tod = () => { const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
const TSTART = ld('2026-09-25'), TEND = ld('2026-10-09');

function todayDay() {
  const t = tod();
  return DAYS.find(d => ld(d.date).getTime() === t.getTime()) || null;
}

function prog(day) {
  const done = day.items.filter(i => S.checked[i.id]).length;
  return {done, total: day.items.length};
}

function fmtDate(s) {
  return ld(s).toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
}
function shortDate(s) {
  return ld(s).toLocaleDateString('de-CH',{day:'numeric',month:'short'});
}

function checkSvg() {
  return `<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 4.5,9 10.5,3" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ── Render: Heute ────────────────────────────────────────────────────
function renderH() {
  const panel = document.getElementById('tab-h');
  const t = tod();

  // Pre-trip countdown (only if no day selected)
  if (t < TSTART && !selDay) {
    const diff = Math.round((TSTART - t) / 86400000);
    document.getElementById('hdr-meta').textContent = '';
    panel.innerHTML = `
      <div class="card">
        <div class="cdown">
          <div style="font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem">Abflug in</div>
          <div class="cdown-n" style="color:var(--sh)">${diff}</div>
          <div class="cdown-u">Tage${diff===1?'':'n'}</div>
          <div class="cdown-d">25. September 2026</div>
        </div>
      </div>
      <div class="slabel">Reiseroute</div>
      <div class="route-cities">
        ${Object.entries(C).map(([id,c])=>{
          const firstDay = DAYS.find(d=>d.city===id);
          return `
          <button class="rci-btn" onclick="openDay('${firstDay?firstDay.id:''}')" style="--cc:${c.color};--cd:${c.dim}">
            <div style="width:3px;min-height:44px;border-radius:2px;background:${c.color};flex-shrink:0"></div>
            <span style="font-size:1.3rem">${c.flag}</span>
            <div style="flex:1;text-align:left">
              <div style="font-weight:700;font-size:.88rem">${c.name}</div>
              <div style="font-size:.7rem;color:var(--muted)">${c.sub}</div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>`}).join('')}
      </div>
      <div style="text-align:center;padding:.85rem 0;font-size:.72rem;color:var(--muted)">
        5 Erwachsene · 3 Kinder (10–14) · 15 Reisetage
      </div>`;
    return;
  }

  // Post-trip (only if no day selected)
  if (t > TEND && !selDay) {
    const total = DAYS.reduce((a,d)=>a+d.items.length,0);
    const done = DAYS.reduce((a,d)=>a+d.items.filter(i=>S.checked[i.id]).length,0);
    document.getElementById('hdr-meta').textContent = '';
    panel.innerHTML = `
      <div class="card">
        <div style="text-align:center;padding:2.5rem 1rem">
          <div style="font-size:3rem">🎉</div>
          <div style="font-family:'Fraunces',serif;font-size:1.5rem;font-weight:700;margin:.5rem 0 .25rem">Unvergessliche Reise!</div>
          <div style="color:var(--muted);font-size:.85rem">15 Tage · 4 Städte · 2 Länder</div>
          <div style="color:var(--muted);font-size:.8rem;margin-top:.4rem">Shanghai · Chongqing · Saigon · Hanoi</div>
          <div style="margin-top:1rem;font-size:.82rem;color:var(--muted)">${done} von ${total} Aktivitäten erledigt</div>
        </div>
      </div>`;
    return;
  }

  // During trip
  const day = selDay ? DAYS.find(d=>d.id===selDay) : todayDay();
  if (!day) {
    panel.innerHTML = `<div style="text-align:center;padding:3rem 1rem;color:var(--muted)">Kein Reisetag gefunden.</div>`;
    return;
  }

  const c = C[day.city];
  const idx = DAYS.indexOf(day);
  const isToday = ld(day.date).getTime() === t.getTime();
  const {done, total} = prog(day);
  const pct = total ? Math.round(done/total*100) : 0;
  const nextDay = DAYS[idx+1] || null;
  const prevDay = DAYS[idx-1] || null;

  document.getElementById('hdr-meta').textContent = `Tag ${idx+1} / 15`;

  const navRow = `
    <div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0 .6rem">
      ${prevDay ? `<button class="back-btn" style="margin:0" onclick="openDay('${prevDay.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        ${shortDate(prevDay.date)}
      </button>` : `<div style="flex:1"></div>`}
      <div style="flex:1;text-align:center">
        ${!isToday ? `<button class="back-btn" style="margin:0;justify-content:center" onclick="selDay=null;renderH()">Heute</button>` : ''}
      </div>
      ${nextDay ? `<button class="back-btn" style="margin:0;flex-direction:row-reverse" onclick="openDay('${nextDay.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        ${shortDate(nextDay.date)}
      </button>` : `<div style="flex:1"></div>`}
    </div>`;

  panel.innerHTML = `
    ${navRow}
    <div class="card" style="${isToday?'box-shadow:0 0 0 2px '+c.color:''}">
      <div class="today-band" style="background:${c.color}"></div>
      <div class="today-meta">
        <div class="city-dot" style="background:${c.color}"></div>
        <span class="cpill" style="background:${c.dim};color:${c.color}">${c.name}</span>
        ${isToday ? `<span class="cpill" style="background:${c.color};color:white;margin-left:.3rem">HEUTE</span>` : ''}
        <span style="font-size:.7rem;color:var(--muted);margin-left:auto">Tag ${day.num}</span>
      </div>
      <div class="today-h">${day.title}</div>
      <div class="today-date">${fmtDate(day.date)}</div>
      ${day.items.map(item => {
        const dn = !!S.checked[item.id];
        return `<div class="ci ${dn?'done':''}" onclick="tog('${item.id}')" style="--cc:${c.color}">
          <div class="cbox">${dn ? checkSvg() : ''}</div>
          <span class="ct">${item.t}</span>
          <span class="cl">${item.l}</span>
        </div>`;
      }).join('')}
      <div class="prog">
        <div class="ptrack"><div class="pfill" style="width:${pct}%;background:${c.color}"></div></div>
        <span class="plabel">${done} / ${total} erledigt</span>
      </div>
    </div>
    `;
}

// ── Render: Tage ────────────────────────────────────────────────────
function renderT() {
  const panel = document.getElementById('tab-t');
  const t = tod();
  let lastCity = null;
  let html = '';

  for (const day of DAYS) {
    const c = C[day.city];
    const dd = ld(day.date);
    const isPast = dd < t;
    const isToday = dd.getTime() === t.getTime();
    const {done, total} = prog(day);
    const allDone = done===total && total>0;

    if (day.city !== lastCity) {
      html += `<div class="city-sep">
        <div class="city-dot" style="background:${c.color}"></div>
        <span class="city-sep-name" style="color:${c.color}">${c.flag} ${c.name}</span>
        <span class="city-sep-sub">${c.sub}</span>
      </div>`;
      lastCity = day.city;
    }

    html += `<div class="dlc" onclick="openDay('${day.id}')"
      style="${isToday?'box-shadow:0 0 0 2px '+c.color+';':''}opacity:${isPast&&!isToday?0.6:1}">
      <div class="dlstripe" style="background:${c.color}"></div>
      <div class="dlcont">
        <div class="dlhdr">
          <span class="dlnum" style="color:${c.color}">${String(day.num).padStart(2,'0')}</span>
          <span class="dltitle">${day.title}</span>
          ${isToday?`<span class="pill-sm" style="background:${c.color};color:white">HEUTE</span>`:''}
          ${allDone&&!isToday?`<span class="pill-sm" style="background:${c.dim};color:${c.color}">✓ Fertig</span>`:''}
          ${!allDone&&done>0?`<span class="pill-sm" style="background:${c.dim};color:${c.color}">${done}/${total}</span>`:''}
        </div>
        <div class="dldate">${shortDate(day.date)}</div>
        <div class="dlitems">
          ${day.items.slice(0,3).map(i=>`
            <div class="dlrow" style="${S.checked[i.id]?'text-decoration:line-through;opacity:.4':''}">
              <span class="t">${i.t}</span><span>${i.l}</span>
            </div>`).join('')}
          ${day.items.length>3?`<div style="color:var(--muted)">+${day.items.length-3} weitere…</div>`:''}
        </div>
      </div>
    </div>`;
  }
  panel.innerHTML = html;
}

// ── Render: Info ────────────────────────────────────────────────────
function renderI() {
  const panel = document.getElementById('tab-i');
  panel.innerHTML = `
    <div class="slabel">Hotels</div>
    ${HOTELS.map(h=>{
      const c=C[h.city];
      return `<div class="hcard">
        <div class="htop">
          <div class="hico" style="background:${c.dim}">🏨</div>
          <div>
            <div class="hname">${h.name}</div>
            <div class="hloc">${c.name} · ${h.loc}</div>
          </div>
        </div>
        <div class="hdates">
          <div class="hdc"><div class="hdl">Check-in</div><div class="hdv">${h.in}</div></div>
          <div class="hdc"><div class="hdl">Check-out</div><div class="hdv">${h.out}</div></div>
          <div class="hdc"><div class="hdl">Nächte</div><div class="hdv">${h.n}</div></div>
        </div>
        ${h.warn?`<div class="hwarn">${h.warn}</div>`:''}
      </div>`;
    }).join('')}
    <div class="slabel">Flüge</div>
    ${FLIGHTS.map(f=>`
      <div class="fitem">
        <div style="font-size:1.2rem">✈️</div>
        <div class="frt">
          <div class="fft">${f.from} → ${f.to}</div>
          <div class="fsub">${f.date}${f.fn?' · '+f.fn:''}</div>
        </div>
        <div class="ftime">${f.time}</div>
      </div>`).join('')}
    <div class="slabel">Gruppe</div>
    <div class="card">
      <div style="display:flex;padding:.5rem 0">
        ${[['5','Erwachsene','--sh'],['3','Kinder (10–14)','--hcm'],['15','Reisetage','--hn']].map(([n,l,v])=>`
          <div style="flex:1;text-align:center;padding:.6rem .25rem">
            <div style="font-family:'Fraunces',serif;font-size:1.9rem;font-weight:700;color:var(${v})">${n}</div>
            <div style="font-size:.7rem;color:var(--muted)">${l}</div>
          </div>`).join('')}
      </div>
    </div>
    <div style="text-align:center;padding:.75rem 0;font-size:.7rem;color:var(--muted)">25. September – 9. Oktober 2026</div>`;
}

// ── Navigation ───────────────────────────────────────────────────────
function go(tab) {
  document.querySelectorAll('.tab').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+tab).classList.add('on');
  document.getElementById('nb-'+tab).classList.add('on');
  window.scrollTo(0,0);
}

function openDay(dayId) {
  if (!dayId) return;
  selDay = dayId;
  renderH();
  go('h');
}

// ── Checklist ────────────────────────────────────────────────────────
async function tog(itemId) {
  if (S.checked[itemId]) delete S.checked[itemId];
  else S.checked[itemId] = true;
  renderH();
  renderT();
  await save();
}

async function save() {
  if (!artCap) return;
  stateEl.textContent = JSON.stringify(S);
  showToast('Wird gespeichert…');
  try {
    await artCap.publish('<!DOCTYPE html>' + document.documentElement.outerHTML);
    showToast('Gespeichert ✓', 2000);
  } catch(e) {
    if (e && e.code === 'conflict') showToast('Gleichzeitige Änderung — kurz warten', 2000);
    else if (e && e.code === 'not_granted') showToast('Nur Lesezugriff', 1500);
    else showToast('Fehler beim Speichern', 2000);
  }
}

// ── Toast ────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, dur) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  if (dur) toastTimer = setTimeout(()=>el.classList.remove('on'), dur);
}

// ── Init ─────────────────────────────────────────────────────────────
renderH(); renderT(); renderI();

setTimeout(async () => {
  artCap = await claude.use('artifact');
  if (!artCap) {
    document.getElementById('hdr-meta').textContent = 'Nur Lesen';
  }
}, 0);
</script>
</body>
</html>
